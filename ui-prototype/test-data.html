<!DOCTYPE html>
<html>
<head>
    <title>Test Data Flow</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>SmartTutor Data Flow Test</h1>
    
    <div>
        <button onclick="checkData()">Check Current Data</button>
        <button onclick="addTestQuiz()">Add Test Quiz</button>
        <button onclick="clearAll()">Clear All Data</button>
    </div>
    
    <div id="output"></div>

    <script>
        function checkData() {
            const output = document.getElementById('output');
            const studentName = localStorage.getItem('studentName');
            const quizHistory = localStorage.getItem('quizHistory');
            
            let html = '<h2>Current Data:</h2>';
            
            // Student Name
            html += '<h3>Student Name:</h3>';
            if (studentName) {
                html += `<p class="success">✓ ${studentName}</p>`;
            } else {
                html += '<p class="error">✗ NOT SET</p>';
            }
            
            // Quiz History
            html += '<h3>Quiz History:</h3>';
            if (quizHistory) {
                const parsed = JSON.parse(quizHistory);
                html += `<p class="success">✓ ${parsed.length} quiz(es) found</p>`;
                html += '<pre>' + JSON.stringify(parsed, null, 2) + '</pre>';
            } else {
                html += '<p class="error">✗ NO QUIZ DATA</p>';
            }
            
            output.innerHTML = html;
        }
        
        function addTestQuiz() {
            // Add a test quiz
            const testQuiz = {
                subject: 'Test Subject',
                topic: 'Test Topic',
                score: 4,
                total: 5,
                percentage: 80,
                passed: true,
                date: new Date().toISOString(),
                timestamp: Date.now()
            };
            
            let quizHistory = JSON.parse(localStorage.getItem('quizHistory') || '[]');
            quizHistory.push(testQuiz);
            localStorage.setItem('quizHistory', JSON.stringify(quizHistory));
            
            alert('Test quiz added!');
            checkData();
        }
        
        function clearAll() {
            if (confirm('Clear all data?')) {
                localStorage.clear();
                alert('All data cleared!');
                checkData();
            }
        }
        
        // Auto check on load
        window.onload = checkData;
    </script>
</body>
</html>

<script>
function setStudentName() {
    const name = prompt('Enter student name:');
    if (name) {
        localStorage.setItem('studentName', name);
        alert('Student name set to: ' + name);
        checkData();
    }
}
</script>

<button onclick="setStudentName()">Set Student Name</button>
